    <style>
        /*css-style*/
        /*general reset*/
        *{
            margin: 0;

        body{
            background: #162831;
        }

        
            .navbar{
                width: 85;
                margin: auto;
                padding: -15px 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo{
                width: 55px;
                cursor: pointer;
                padding: 5px;
                margin-left: 15px;
                border-radius: 15px;
            }

            .navbar ul li{
                list-style: none;
                display:inline-block;
                margin: 0 7px;
                top: 0 10PXS;
                position: relative;
                right: 38px;
            }
            .navbar ul li a{
                text-decoration: none;
                color: white;
                text-transform: uppercase;
            }

            .navbar ul li a::after{
                content: '';
                height: 3px;
                width: 0;
                background: #fff;
                position: absolute;
                left: 0;
                bottom: -5px;
                transition: 0.5s;
                transform: scaleX(1);
                transform-origin: left;
            }  

            .navbar ul li a:hover::after{
                width: 100%;
            }

        .container{
            width: 80%;
            margin: 80px auto;
        }

        .container h1{
            padding: 60px 0;
            color: #fff;
            font-style: inherit;
            font-size: 44px;
            text-align: end;
        }

        .row{
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .col{
            flex-basis: 50%;
            min-width: 250px;
        }

        .feature-img{
            margin: 20%;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
        }

        .small-img-row{
            display: flex;
            background: #fff;
            margin: 20px 0;
            border-radius: 6px;
            overflow: hidden;
            width: 85%;

        }

        .small-img{
            position: relative;
        }

        .small-img img{
            width: 150px;
        }

        .small-img-row p{
            width: 150px;
            margin-left: 20px;
            color: #162831;
            font-size: 15px;
        }

        .play-btn{
            width: 40px;
            border-radius: 7px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            cursor: pointer;
        }

        .small-img .play-btn{
            width: 35px;
            border-radius: 8px;
        }

        .video-player{
            width: 50%;
            border-radius: 20px;
            position: absolute;
            margin-left:  -44%;
            margin-top: -54%;
            left: 50%;
            transform: translate(-50%,-50%);
            display: none;
            padding-left: 40%;
        }

        video:focus{
            outline: none;
        }

        .close-btn{
            position: absolute;
            top: 10px;
            border-radius: 7px;
            padding-top: -20%;
            right: 10px;
            width: 30px;
            cursor: pointer;
        }

        /*footer*/
            footer{
                background-color: white;
                color: black;
                text-align: center;
                padding: 10px;
                margin-top: auto;
            }

            /*Mobile Responsiveness*/
            @media (max-width:768px) {
                card-grid{
                    flex-direction: column;
                }
            }






    </style>
</head>
